server {
    listen 80;
    listen [::]:80;
    server_name ldj.recruit.kayple.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ldj.recruit.kayple.com;

    ssl_certificate     /etc/letsencrypt/live/ldj.recruit.kayple.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ldj.recruit.kayple.com/privkey.pem;

    root /var/www/booking;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: /admin, /my, /done 등은 index.html 로
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
