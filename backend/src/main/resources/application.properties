spring.application.name=backend
server.port=8080
server.address=127.0.0.1
spring.datasource.url=jdbc:mysql://localhost:3306/app?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:app}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=2h
# 관리자 계정은 1개. 비밀번호는 서버 환경변수로만 주입한다(코드/깃에 넣지 않음)
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD}
